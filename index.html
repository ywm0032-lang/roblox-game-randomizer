<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roblox Game Randomizer</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
    color: #eef2ff;
    background: #000000;
    padding: 25px 15px 50px;
  }

  .container {
    max-width: 950px;
    margin: auto;
  }

  .header {
    text-align: center;
    margin-bottom: 25px;
  }

  h1 {
    margin: 0;
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -1px;
    color: white;
    text-shadow:
      0 0 18px rgba(124, 92, 255, 0.65),
      0 0 45px rgba(124, 92, 255, 0.25);
  }

  h1 span {
    color: #7c5cff;
  }

  .subtitle {
    margin-top: 8px;
    color: #9aa6c4;
    font-weight: 600;
  }

  .card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    box-shadow:
      0 25px 70px rgba(0, 0, 0, 0.7),
      0 0 40px rgba(124, 92, 255, 0.08);
  }

  .game-image {
    width: 100%;
    max-width: 560px;
    height: 290px;
    object-fit: cover;
    border-radius: 20px;
    border: 1px solid #333333;
    display: block;
    margin: auto;
    background: #000000;
    box-shadow:
      0 20px 45px rgba(0, 0, 0, 0.6),
      0 0 30px rgba(124, 92, 255, 0.18);
  }

  .game-title {
    font-size: 30px;
    font-weight: 900;
    margin: 20px 0 8px;
    color: white;
    text-shadow: 0 0 18px rgba(124, 92, 255, 0.35);
  }

  .rarity {
    display: inline-block;
    font-size: 16px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid currentColor;
    margin-bottom: 25px;
  }

  .r-common {
    color: #9aa6c4;
    box-shadow: 0 0 18px rgba(154, 166, 196, 0.25);
  }

  .r-uncommon {
    color: #4ade80;
    box-shadow: 0 0 18px rgba(74, 222, 128, 0.3);
  }

  .r-rare {
    color: #38bdf8;
    box-shadow: 0 0 18px rgba(56, 189, 248, 0.3);
  }

  .r-epic {
    color: #a855f7;
    box-shadow: 0 0 18px rgba(168, 85, 247, 0.35);
  }

  .r-legendary {
    color: #f59e0b;
    box-shadow: 0 0 18px rgba(245, 158, 11, 0.35);
  }

  .r-mythic {
    color: #ef4444;
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.4);
  }

  .roll-button {
    display: block;
    width: 100%;
    max-width: 360px;
    margin: auto;
    padding: 20px;
    font-size: 23px;
    font-weight: 900;
    letter-spacing: 1px;
    color: white;
    background: linear-gradient(135deg, #7c5cff, #4f9cff);
    border: none;
    border-radius: 18px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow:
      0 0 25px rgba(124, 92, 255, 0.55),
      0 15px 35px rgba(0, 0, 0, 0.5);
    transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
  }

  .roll-button:hover {
    transform: translateY(-3px);
    filter: brightness(1.1);
    box-shadow:
      0 0 38px rgba(124, 92, 255, 0.75),
      0 18px 40px rgba(0, 0, 0, 0.55);
  }

  .roll-button:active {
    transform: translateY(1px);
  }

  .roll-button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
  }

  .index {
    margin-top: 40px;
  }

  h2 {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 5px;
    color: white;
    text-shadow: 0 0 15px rgba(124, 92, 255, 0.3);
  }

  .index-subtitle {
    color: #9aa6c4;
    font-weight: 600;
    margin-bottom: 18px;
  }

  .game-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
    gap: 16px;
  }

  .game-card {
    background: #0d0d0d;
    border: 1px solid #262626;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .game-card:hover {
    transform: translateY(-4px);
    border-color: #7c5cff;
    box-shadow:
      0 15px 35px rgba(0, 0, 0, 0.6),
      0 0 25px rgba(124, 92, 255, 0.28);
  }

  .game-card img {
    width: 100%;
    height: 135px;
    object-fit: cover;
    display: block;
    background: #000000;
  }

  .game-card-info {
    padding: 13px;
    text-align: left;
  }

  .game-card-title {
    font-size: 16px;
    font-weight: 800;
    color: white;
  }

  .game-card-rarity {
    margin-top: 6px;
    font-size: 12px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

  .r-common { color: #9aa6c4; }
  .r-uncommon { color: #4ade80; }
  .r-rare { color: #38bdf8; }
  .r-epic { color: #a855f7; }
  .r-legendary { color: #f59e0b; }
  .r-mythic { color: #ef4444; }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Roblox <span>Game Randomizer</span></h1>
    <p class="subtitle">
      Roll for random Roblox games. Better rarities are harder to get.
    </p>
  </div>

  <div class="card">
    <img
      id="gameImage"
      class="game-image"
      src=""
      alt="Roblox game thumbnail"
    >

    <div class="game-title" id="gameTitle">
      Press Roll to start
    </div>

    <div class="rarity" id="gameRarity">
      Rarity: ???
    </div>

    <button class="roll-button" id="rollButton" onclick="rollGame()">
      Roll
    </button>
  </div>

  <div class="index">
    <h2>Roblox Game Index</h2>
    <p class="index-subtitle">
      Browse every Roblox game available in the randomizer.
    </p>

    <div class="game-grid" id="gameGrid"></div>
  </div>
</div>

<script>
const games = [
  {
    title: "Adopt Me!",
    rarity: "Common",
    image: "https://i.pinimg.com/736x/2a/4d/09/2a4d092f81027803ee813402963783f4.jpg"
  },
  {
    title: "Brookhaven RP",
    rarity: "Common",
    image: "https://tr.rbxcdn.com/180DAY-6ee25638908aba49f33c6ce6f13fdf3b/768/432/Image/Png/noFilter"
  },
  {
    title: "Obby Creator",
    rarity: "Common",
    image: "https://tr.rbxcdn.com/180DAY-6c2aea83c0ffee410bbd2ff8935fdeff/768/432/Image/Png/noFilter"
  },
  {
    title: "Blox Fruits",
    rarity: "Uncommon",
    image: "https://tr.rbxcdn.com/180DAY-77b3430ced16006f6da18d6a77b95ea0/768/432/Image/Png/noFilter"
  },
  {
    title: "Doors",
    rarity: "Rare",
    image: "https://tr.rbxcdn.com/180DAY-e822a794752ce011565eca23a280f4dc/768/432/Image/Png/noFilter"
  },
  {
    title: "Murder Mystery 2",
    rarity: "Rare",
    image: "https://tr.rbxcdn.com/180DAY-f483597f5ce44b2617413c11c7425802/768/432/Image/Png/noFilter"
  },
  {
    title: "Nullscapes",
    rarity: "Rare",
    image: "https://tr.rbxcdn.com/180DAY-4eae4d78f4fb9a18334818920626bb48/768/432/Image/Png/noFilter"
  },
  {
    title: "Grow a Garden",
    rarity: "Epic",
    image: "https://tr.rbxcdn.com/180DAY-eae2baf51021aa5687214da860f0eff9/768/432/Image/Png/noFilter"
  },
  {
    title: "Blade Ball",
    rarity: "Epic",
    image: "https://tr.rbxcdn.com/180DAY-be150ba07c74cd57deb31791c2675323/768/432/Image/Png/noFilter"
  },
  {
    title: "Grow a Garden 2",
    rarity: "Epic",
    image: "https://tr.rbxcdn.com/180DAY-7dce127c50d46bb92b9601335b8363b3/768/432/Image/Png/noFilter"
  },
  {
    title: "Jailbreak",
    rarity: "Legendary",
    image: "https://tr.rbxcdn.com/180DAY-3c80b2fc1f8d1a1ef72048e98bc1ebae/768/432/Image/Png/noFilter"
  },
  {
    title: "The Strongest Battlegrounds",
    rarity: "Legendary",
    image: "https://tr.rbxcdn.com/180DAY-c947df5b221c30672c3591247a8c6495/768/432/Image/Png/noFilter"
  },
  {
    title: "Da Hood",
    rarity: "Legendary",
    image: "https://tr.rbxcdn.com/180DAY-655a8b7fc990b48f595db9bcfd7ea70b/768/432/Image/Png/noFilter"
  },
  {
    title: "Dress to Impress",
    rarity: "Mythic",
    image: "https://tr.rbxcdn.com/180DAY-d1d34e3e05aa722be00171804119c874/768/432/Image/Png/noFilter"
  }
];

const rarities = [
  { name: "Common", chance: 45, level: 1 },
  { name: "Uncommon", chance: 25, level: 2 },
  { name: "Rare", chance: 15, level: 3 },
  { name: "Epic", chance: 9, level: 4 },
  { name: "Legendary", chance: 5, level: 5 },
  { name: "Mythic", chance: 1, level: 6 }
];

function rollGame() {
  const rollButton = document.getElementById("rollButton");

  rollButton.disabled = true;
  rollButton.textContent = "Rolling";

  setTimeout(() => {
    const totalChance = rarities.reduce(
      (total, rarity) => total + rarity.chance,
      0
    );

    let random = Math.random() * totalChance;
    let chosenRarity = rarities[0];

    for (const rarity of rarities) {
      random -= rarity.chance;

      if (random <= 0) {
        chosenRarity = rarity;
        break;
      }
    }

    const matchingGames = games.filter(
      game => game.rarity === chosenRarity.name
    );

    const game = matchingGames[
      Math.floor(Math.random() * matchingGames.length)
    ];

    showGame(game);

    rollButton.disabled = false;
    rollButton.textContent = "Roll";
  }, 500);
}

function showGame(game) {
  document.getElementById("gameImage").src = game.image;
  document.getElementById("gameTitle").textContent = game.title;

  document.getElementById("gameRarity").textContent =
    game.rarity;

  document.getElementById("gameRarity").className =
    "rarity r-" + game.rarity.toLowerCase();
}

function buildIndex() {
  const grid = document.getElementById("gameGrid");

  games.forEach(game => {
    const card = document.createElement("div");
    card.className = "game-card";

    card.innerHTML = `
      <img src="${game.image}" alt="${game.title}">
      <div class="game-card-info">
        <div class="game-card-title">${game.title}</div>
        <div class="game-card-rarity r-${game.rarity.toLowerCase()}">
          ${game.rarity}
        </div>
      </div>
    `;

    card.onclick = function () {
      showGame(game);
    };

    grid.appendChild(card);
  });
}

buildIndex();
</script>

</body>
</html>
